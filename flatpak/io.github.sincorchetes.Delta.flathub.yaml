# The manifest for Flathub: the same as io.github.sincorchetes.Delta.yaml, but Delta comes from the tag of a
# release (Flathub builds offline and from pinned sources). Submitted to Flathub as io.github.sincorchetes.Delta.yaml,
# next to python3-borgbackup.json. See flatpak/README.md.
app-id: io.github.sincorchetes.Delta
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: delta-ui
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/run/media
  - --env=DELTA_LOCALEDIR=/app/share/locale
  - --env=GSETTINGS_BACKEND=keyfile

modules:
  - python3-borgbackup.json

  - name: delta
    buildsystem: meson
    config-opts:
      - -Dsystemd_units=false
      - -Dnautilus_extension=false
    sources:
      - type: git
        url: https://github.com/sincorchetes/delta.git
        tag: v0.1.0
        commit: e9ecb6c0907fdd19c5765a05b9652cf610d7832a
    post-install:
      - ln -sf ../libexec/delta-daemon /app/bin/delta-daemon
