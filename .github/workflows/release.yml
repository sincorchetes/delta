name: Publish packages

# When a version tag is pushed, publishes the package to the AUR and, if the secret OBS_TOKEN exists, to the openSUSE Build
# Service (without it, OBS is published by hand: packaging/obs/README.md). The GitHub Release and the Flatpak bundle are
# made by flatpak.yml. The credentials are secrets of the `release` environment.
# By hand (Run workflow) it checks everything but the last step: the push to the AUR, and the branch and the trigger of OBS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish (for example v0.1.1)
        required: true
      dry_run:
        description: Do everything but the push to the AUR
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

jobs:
  aur:
    name: Publish to the AUR
    runs-on: ubuntu-latest
    environment: release
    container: docker.io/library/archlinux:base
    steps:
      # The scripts and the pinned host keys: those of the workflow that runs (main, or the tag itself).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # What is published: the tree of the tag, which by hand can be an older one than the scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: tag

      - name: The tag says what the tree says
        run: sh scripts/ci/check_tag.sh "$TAG" tag

      - name: Publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL }}
          SOURCE_DIR: ${{ github.workspace }}/tag
        run: sh scripts/ci/publish_aur.sh "$TAG"

  obs:
    name: Publish to OBS
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # to move the branch `release`, which OBS reads
    steps:
      # The script: the one of the workflow that runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The tag, from which the script runs git: by hand it can be an older one than the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: tag

      - name: The tag says what the tree says
        run: sh scripts/ci/check_tag.sh "$TAG" tag

      - name: Publish
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        working-directory: tag
        run: sh "$GITHUB_WORKSPACE/scripts/ci/publish_obs.sh" "$TAG"
