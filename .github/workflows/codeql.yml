name: CodeQL

# Static analysis for security problems, apart from the tests: it reads the code, it does not run it.
# Python is Delta itself; `actions` reads these workflows (a script injection there would be a way into the repository).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: a query added later can find an old problem

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # nothing to compile: both are read as they are

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
