name: Distributions

# Delta on the system libraries of each distribution, and on Nix: the packages the distribution ships (`python3-gobject`,
# GTK, libadwaita, BorgBackup) with its own Python. No uv and nothing from PyPI: it is what a user of its package gets.
#
# It is a check, not a gate: it does not block a pull request. Run it by hand from the Actions tab, or wait for the weekly run
# (a failure of the weekly run reaches your e-mail). Flatpak is another story: it brings its own runtime.

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

jobs:
  distros:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.options }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Fedora", image: "fedora:latest", options: "--cap-add=IPC_LOCK" }
          # gnome-keyring-daemon stops in Fedora and Arch with "error dropping process capabilities": their containers get IPC_LOCK,
          # the capability that daemon keeps, and with it the keyring starts
          - { name: "Arch Linux", image: "archlinux:latest", options: "--cap-add=IPC_LOCK" }
          - { name: "openSUSE Tumbleweed", image: "opensuse/tumbleweed:latest" }
          - { name: "AlmaLinux 10", image: "almalinux:10" }
          - { name: "Rocky Linux 10", image: "rockylinux/rockylinux:10" }
          - { name: "Ubuntu 26.04", image: "ubuntu:26.04" }
          - { name: "Ubuntu 26.10", image: "ubuntu:26.10" }
          - { name: "Debian 13", image: "debian:trixie" }
    steps:
      - uses: actions/checkout@v7

      - name: Install the distribution's packages
        run: sh scripts/ci/install-deps.sh

      - name: The minimum base is there (versions and the interface classes Delta calls)
        run: python3 scripts/ci/check_base.py

      - name: Build
        run: |
          meson setup build
          meson compile -C build

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run data

      - name: Validate the desktop entry and the AppStream metadata
        run: meson test -C build

      - name: Tests
        # Widget tests need a display: xvfb-run gives one, xwfb-run (Xwayland on a headless Weston) where there is no Xvfb
        # (Enterprise Linux 10); without either they are left out and the log says so. --capture=sys lets what the C
        # libraries print reach the log at once: with the default capture it is lost when one of them aborts the process.
        run: |
          if command -v xvfb-run > /dev/null; then
            xvfb-run -a python3 -m pytest -q --capture=sys
          elif command -v xwfb-run > /dev/null; then
            xwfb-run -- python3 -m pytest -q --capture=sys
          else
            echo "::warning::no xvfb-run on this distribution: the GTK widget tests were not run"
            python3 -m pytest -q --capture=sys --ignore=tests/gtk
          fi

  # The flake builds Delta with the libraries of nixpkgs, the "system" libraries of Nix, and its NixOS module gives a system
  # what a session needs to find (scripts/ci/nixos-module-check.nix builds a minimal one, and check_nixos_module.sh looks at it).
  nix:
    name: Nix (flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: Build the package
        run: nix build --print-build-logs

      - name: Check the flake
        run: nix flake check --print-build-logs

      - name: The NixOS module, as a flake module
        run: |
          result=$(nix build --no-link --print-out-paths --impure --expr 'import ./scripts/ci/nixos-module-check.nix { withFlake = true; }')
          sh scripts/ci/check_nixos_module.sh "$result"

      - name: The NixOS module, imported by path from a configuration.nix with no flake
        run: |
          result=$(nix build --no-link --print-out-paths --impure --expr 'import ./scripts/ci/nixos-module-check.nix { withFlake = false; }')
          sh scripts/ci/check_nixos_module.sh "$result"
