name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A change in website/ runs only the pipeline of the website; anything else runs the tests and not the website.
  # A job that is skipped counts as passed for the required checks.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.areas.outputs.code }}
      web: ${{ steps.areas.outputs.web }}
      mutation: ${{ steps.areas.outputs.mutation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: sh scripts/ci/changed_areas.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  # The same environment developers use (devenv), so "works on my machine" is the CI.
  # The packages for each distribution are built by OBS, and `distros.yml` checks Delta on the system libraries
  # of each one (it does not block a pull request).
  devenv:
    name: devenv (tests, quality, Sonar)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs the history to attribute new code

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Sync Python environment
        run: devenv shell -- sh scripts/sync-venv.sh

      - name: Lint (ruff)
        run: devenv shell -- ruff check src tests scripts

      - name: Types (pyright)
        run: devenv shell -- pyright

      - name: Build
        run: devenv shell -- sh -c 'meson setup build && meson compile -C build'

      - name: Validate GSettings schema
        run: devenv shell -- glib-compile-schemas --strict --dry-run data

      - name: Validate the desktop entry and the AppStream metadata
        run: devenv shell -- meson test -C build

      - name: Tests with coverage
        # On every core of the runner (pytest-xdist); the coverage of each worker is combined into one report.
        run: devenv shell -- xvfb-run -a uv run pytest -q -n auto --cov --cov-report=xml --cov-report=term:skip-covered

      - name: Mutation tests
        # Changes the code on purpose and checks that some test notices; fails if more survive than the one equivalent.
        # A pull request that changes nothing they read (documents, packaging, other scripts) skips them: they are more than
        # half of this job. Every push to main runs them, so what is merged is always checked.
        if: github.event_name != 'pull_request' || needs.changes.outputs.mutation == 'true'
        run: devenv shell -- sh scripts/ci/check_mutants.sh

      - name: SonarQube Cloud
        # Secrets are not handed to pull requests from forks. The project is given here, not in a file.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        with:
          args: >
            -Dsonar.organization=sincorchetes
            -Dsonar.projectKey=sincorchetes_delta
            -Dsonar.projectName=Delta
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12,3.13,3.14
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=po/**,data/**,nix/**
            -Dsonar.coverage.exclusions=scripts/**,website/**
            -Dsonar.sourceEncoding=UTF-8

  # The website is built when website/ changes, and published only from main.
  web:
    name: website (build and check)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile --ignore-scripts

      # Type-checks the content, then writes plain files to website/dist: GitHub Pages serves no code.
      - run: bun run build

      - name: Check what was built
        # Both languages have the pages, and the domain file is there.
        run: |
          for page in install first-backup how-it-works technical; do
            for folder in dist dist/es; do
              test -s "$folder/$page/index.html" || { echo "::error::missing $folder/$page/"; exit 1; }
            done
          done
          test -s dist/CNAME

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    name: publish the website
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
