[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "delta"
version = "0.5.2"
description = "GNOME integrated, BorgBackup powered file time travel"
requires-python = ">=3.12"
dependencies = [
    "PyGObject>=3.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",  # `test` and `cov` of devenv run the suite on every core (`-n 0` for one process)
    "python-dbusmock>=0.32",
    "pyyaml>=6",  # so that a workflow that is not valid YAML fails here and not as an empty run on GitHub
    "hypothesis>=6",  # properties that must hold for any input (tests/unit/test_properties.py)
    "mutmut>=3",  # mutation testing: `uv run mutmut run` shows which tests do not really watch the code
    # Build backend for the meson-based source distributions (PyGObject,
    # pycairo, dbus-python), built against the system libraries from
    # devenv/CI. meson, ninja and patchelf come from the system (devenv or
    # the distro): their PyPI wheels ship generic-Linux binaries that do
    # not run on NixOS.
    "meson-python>=0.17",
    "poetry-core>=2.0",
]

[project.scripts]
delta-daemon = "delta.daemon.main:main"

[tool.poetry]
packages = [{ include = "delta", from = "src" }]

[tool.uv]
# GNOME sdists are built with the meson/ninja installed in the venv itself,
# against the system libraries provided by devenv.
no-build-isolation = true
python-preference = "only-system"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/delta", "src/nautilus"]
relative_files = true
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100  # lines and branches; the GTK widget tests need a display (xvfb-run where there is none)
# No "pragma: no cover" and no omitted files: what the tests do not run is reported, not hidden.

[tool.mutmut]
# Mutation testing (`uv run mutmut run`, then `mutmut results`): the logic that decides what is restored, kept, refused, parsed,
# told, scheduled or reported on the bus. mutmut runs only tests/unit/, so what is left out is what those tests cannot judge:
# the handlers of the D-Bus calls (`job_calls`, `query_calls`, `service`, `introspection`) and the wiring (`composition`, `main`,
# `stop_signals`), tested through a real bus in tests/integration/; the adapters of the platform (`borg_runner`, `borg_mounter`,
# `libsecret_store`, `systemd_scheduler`, `background_portal`, `session_events`, `ui_launcher`, `gio_notifier`), tested with the
# real Borg, keyring and session.
# `sh scripts/ci/mutants_by_module.sh` says where the survivors are after a run.
source_paths = ["src/"]
only_mutate = [
    "src/delta/domain/*",
    "src/delta/application/*",
    "src/delta/infrastructure/borg_parsing.py",
    "src/delta/infrastructure/borg_commands.py",
    "src/delta/infrastructure/timer_scheduler.py",
    "src/delta/infrastructure/local_destination.py",
    "src/delta/infrastructure/drive_mounts.py",
    "src/delta/infrastructure/mount_events.py",
    "src/delta/infrastructure/file_job_journal.py",
    "src/delta/infrastructure/proc_mount_usage.py",
    "src/delta/infrastructure/listing_cache.py",
    "src/delta/infrastructure/background_scheduler.py",
    "src/delta/infrastructure/settings.py",
    "src/delta/daemon/next_run.py",
    "src/delta/daemon/backup_task.py",
    "src/delta/daemon/browse_controller.py",
    "src/delta/daemon/job_runner.py",
    "src/delta/daemon/config_reloader.py",
    "src/delta/daemon/drive_return.py",
    "src/delta/ui/wizard.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/"]
# Tests of the repository itself, not of rules: the first reads the source files (which mutmut has
# already rewritten with its mutants), the second the files at the root (LICENSE, meson.build, ...),
# which are not copied into the mutants folder.
pytest_add_cli_args = [
    "--ignore=tests/unit/test_translations_complete.py",
    "--ignore=tests/unit/test_credits.py",
    "--ignore=tests/unit/test_help_pages.py",
    "--ignore=tests/unit/test_appstream.py",
    "--ignore=tests/unit/test_changed_areas.py",
    "--ignore=tests/unit/test_changelog_assemble.py",
    "--ignore=tests/unit/test_check_tag.py",
    "--ignore=tests/unit/test_meson_options.py",
    "--ignore=tests/unit/test_mutation_ignores.py",
    "--ignore=tests/unit/test_meson_install.py",
    "--ignore=tests/unit/test_flatpak_manifest.py",
    "--ignore=tests/unit/test_nix_module.py",
    "--ignore=tests/unit/test_package_smoke_script.py",
    "--ignore=tests/unit/test_packaging.py",
    "--ignore=tests/unit/test_release_notes.py",
    "--ignore=tests/unit/test_website_pages.py",
    "--ignore=tests/unit/test_workflows_yaml.py",
]
# Workers are forked from a clean server, not from the process that already ran the suite: a test
# that starts a real process (Gio.Subprocess) hangs forever in a fork of a process GLib has threads in.
process_isolation = "forkserver"
forkserver_warmup = "none"
also_copy = ["po/"]  # test_i18n compiles po/es.po, resolved relative to the copied tests

[tool.pyright]
# The same checker as the editor shows. `basic` first: PyGObject has no type stubs, so what comes from `gi.repository` is untyped,
# and what is checked is Delta's own code. The interpreter is the one on the PATH (the venv, inside devenv shell).
include = ["src"]
stubPath = "typings"  # a stub for PyGObject, which has none
pythonVersion = "3.12"  # the oldest that Delta supports (GNOME 46)
pythonPlatform = "Linux"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 120
extend-exclude = [".devenv", "build", "result"]

[tool.ruff.lint]
# Explicit, so a newer ruff with more rules on by default does not turn the same code into errors.
select = ["E4", "E7", "E9", "F"]
# PyGObject needs `gi.require_version(...)` to run before `from gi.repository import ...`, so some imports follow code.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# A fixture shared by several test files lives in a `*_support` module and is imported by each one, so the tests that ask
# for it by name look like a redefinition.
"tests/**" = ["F811"]
